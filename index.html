    <script>
      // Compatibility shim for browser extensions/test runners that assign window.fetch
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          let _currentFetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            get() {
              return _currentFetch;
            },
            set(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (_) {}
    </script>
